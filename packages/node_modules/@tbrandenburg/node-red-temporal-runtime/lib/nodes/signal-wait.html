<!--
  issue #98: editor definition for the one project-owned "temporal signal
  wait" node. Follows stock Node-RED node conventions (see
  packages/node_modules/@node-red/nodes/core/function/89-delay.html for the
  reference pairing this mirrors).
-->
<script type="text/javascript">
    RED.nodes.registerType('temporal signal wait', {
        category: 'temporal',
        color: '#e2d96e',
        defaults: {
            name: { value: "" },
            keyProperty: { value: "waitKey", required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-hourglass-half",
        label: function() {
            return this.name || "temporal signal wait";
        },
        paletteLabel: "signal wait"
    });
</script>

<script type="text/html" data-template-name="temporal signal wait">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-keyProperty"><i class="fa fa-key"></i> Key property</label>
        <input type="text" id="node-input-keyProperty" placeholder="waitKey">
    </div>
</script>

<script type="text/html" data-help-name="temporal signal wait">
    <p>Durably waits for an external Temporal Signal, without holding a Temporal Activity open while it waits.</p>
    <p>Reads a correlation key from <code>msg[keyProperty]</code> (default msg property: <code>waitKey</code>) and suspends the current Workflow execution until a matching <code>nodeRedTemporalResume</code> Temporal Signal is received for that key:</p>
    <pre>signal name: nodeRedTemporalResume
payload: { key: "&lt;your key&gt;", data: &lt;any serializable payload&gt; }</pre>
    <p>On resume, the delivered signal payload (<code>data</code> above) is exposed to the resumed message as <code>msg.signal</code>, unchanged/opaque. The configured key property is removed from the outgoing message before it continues downstream.</p>
    <p>Requires a Temporal Client or the <code>temporal</code> CLI to know the target Workflow ID and the configured key - this node does not add an HTTP callback endpoint.</p>
    <h3>Details</h3>
    <p>Only works when deployed to a runner started by this project's <code>node-red-temporal</code> worker (the default runner already composes this node's suspension behavior together with the opt-in durable fixed Delay adapter - see the runtime package README's "Temporal Signal Wait" section).</p>
</script>
